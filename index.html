<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive With Jason">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Drive With Jason</title>
<style>
:root{--bg:#eceff2;--card:#fff;--tx:#1b2430;--mu:#5d6773;--bd:#d3d9df;--ac:#0b57a4;--g:#2e7d32;--gbg:#dff1d6;--n:#e6e9ed;--hd:#5a5d61;--nt:#b3261e;--abg:#fff1cc;--abd:#c77700;--atx:#7a4a00;--wt:#a85f00;--rbg:#fde3e1;--rbd:#b3261e;--rtx:#8c1d18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1f252c;--tx:#eef1f4;--mu:#a3adb8;--bd:#36404a;--ac:#7db4ee;--g:#8fd39e;--gbg:#1d3d22;--n:#2b333b;--hd:#3a4048;--nt:#ff8f85;--abg:#3d2e0f;--abd:#e0a030;--atx:#f2c46a;--wt:#f2c46a;--rbg:#4a1d1a;--rbd:#ff8f85;--rtx:#ffb4ab}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1f252c;--tx:#eef1f4;--mu:#a3adb8;--bd:#36404a;--ac:#7db4ee;--g:#8fd39e;--gbg:#1d3d22;--n:#2b333b;--hd:#3a4048;--nt:#ff8f85;--abg:#3d2e0f;--abd:#e0a030;--atx:#f2c46a;--wt:#f2c46a;--rbg:#4a1d1a;--rbd:#ff8f85;--rtx:#ffb4ab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
@media (min-width:900px){:root:not([data-cols="1"]) main.wide{max-width:1040px}:root:not([data-cols="1"]) .skl{columns:2;column-gap:24px}:root:not([data-cols="1"]) .grp{break-inside:avoid}}
.skl{margin-top:20px}.skl .sec{margin-top:0}.grp{margin-bottom:20px}
button,input{font:inherit;color:inherit}
.logo{display:flex;align-items:baseline;gap:6px;font-weight:800;letter-spacing:-1px;line-height:1;margin:8px 0 4px}
.logo b{font-size:44px}.logo i{font-style:normal;font-size:18px;font-weight:600;letter-spacing:0;position:relative;top:-14px}
h1{font-size:24px;font-weight:600;margin:8px 0 4px}
.mu{color:var(--mu);font-size:14px}
.add{display:flex;gap:8px;margin:16px 0}
#addb{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:700}
input[type=search]{box-sizing:border-box;padding:12px;font-size:16px;border:0;border-radius:10px;background:var(--card);color:var(--tx);min-height:48px;-webkit-appearance:none;appearance:none}
input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--card);font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);font-weight:400}
.pupil{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
[data-owe="off"] .owe{display:none}
[data-ll="off"] .ll,[data-ll="off"] .llr{display:none}
.ll{font-size:13px;color:var(--mu);margin-top:4px}
.llr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.llr label{color:var(--wt);font-weight:700;flex:none}
.llr input[type=date]{margin:0;flex:none;width:auto;min-width:0;min-height:32px;padding:3px 8px;font-size:14px;background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--wt);font-weight:700}
.llr.done label,.llr.done input[type=date],.llr.done .btn{color:var(--g)}
.llp{flex:none;min-height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--wt);font-size:14px;font-weight:700;cursor:pointer}
.llp.on{background:var(--gbg);border-color:var(--g);color:var(--g)}
.llr .btn{flex:none;background:none;border:0;min-height:32px;padding:0 6px;color:var(--wt);font-size:13px;font-weight:700;text-decoration:underline}
.owe{flex:none;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:var(--nt);color:#fff;font:700 14px/20px system-ui,-apple-system,sans-serif;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--n);overflow:hidden;margin-top:8px}
.mres{position:sticky;top:6px;z-index:5;border:2px solid;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.mres.ok{background:var(--gbg);border-color:var(--g);color:var(--g)}
.mres.bad{background:var(--rbg);border-color:var(--rbd);color:var(--rtx)}
.mrt{font-size:22px;font-weight:800;letter-spacing:.04em}
.mrs{margin-top:4px;font-weight:700}
.mlist{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.mr{padding:10px 12px;border-bottom:1px solid var(--bd)}
.mr:last-child{border-bottom:0}
.mn{font-weight:600;margin-bottom:8px}
.mc{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.mdl{color:var(--mu);font-size:14px}
.mb{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--n);font-size:22px;line-height:1;cursor:pointer;padding:0}
.mcnt{min-width:24px;text-align:center;font-size:20px}
.mcnt.has{color:var(--wt)}
.mt{min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--bd);background:none;font-weight:600;cursor:pointer}
.mt.ok{background:var(--gbg);border-color:var(--g);color:var(--g)}
.mt.s.on{background:var(--rbd);border-color:var(--rbd);color:var(--card)}
.mt.x.on{background:#5b0f0b;border-color:var(--rbd);color:#fff}
.bar{display:flex}
.bar i{display:block;height:100%;background:var(--g)}
.bar i.a{background:var(--abd)}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0}
.sec{background:var(--hd);color:#fff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;margin:20px 0 0;border-radius:6px 6px 0 0}
.it{background:var(--card);border:1px solid var(--bd);border-top:0}
.it:last-child{border-radius:0 0 6px 6px}
.r{display:flex;align-items:center}
.ck{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 12px;min-height:48px;cursor:pointer}
.box{width:24px;height:24px;border-radius:5px;border:2px solid var(--bd);background:var(--n);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent}
.on .box{background:var(--g);border-color:var(--g);color:var(--card)}
.on .lb{color:var(--g)}
.wip .box{background:var(--abd);border-color:var(--abd);color:var(--card)}
.wip .lb{color:var(--wt);font-weight:600}
.b{font-weight:600}
.nb{background:none;border:0;color:var(--mu);padding:12px;cursor:pointer;display:grid;place-items:center}
.nb svg{width:20px;height:20px;display:block}
.nb.has{color:var(--ac)}
.nv{color:var(--nt);font-size:14px;font-weight:600;padding:0 12px 10px 48px;margin-top:-6px}
.nv:empty{display:none}
.ni{margin:0 12px 10px 48px;width:calc(100% - 60px);box-sizing:border-box}
.pre .ck{border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.del{margin-top:28px;width:100%;color:var(--nt);border-color:currentColor}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.lg{cursor:pointer;width:190px;max-width:100%;height:auto;background:#fff;border:2px solid #000;border-radius:8px;padding:5px 8px;box-sizing:border-box;flex:none;margin-left:auto}
.thm{margin-top:12px}
.thm .btn{width:100%}
.tl{display:block;margin:0 0 4px}
#tt,#tw{margin-bottom:12px}
.sp{margin:12px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.sp textarea{min-height:170px}
.td{width:100%;box-sizing:border-box;margin-bottom:4px}
input[type=tel]{width:100%;box-sizing:border-box;padding:14px;border:2px solid var(--tx);border-radius:10px;background:var(--bg);color:var(--tx);font-size:22px;font-weight:600;letter-spacing:.05em;margin-bottom:4px}
input[type=date],input[type=datetime-local]{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;margin:0 0 4px;min-height:48px;display:block;min-width:0;max-width:100%;text-align:left;-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;min-height:1.3em;margin:0}
#paw .btn{text-align:left}
#pbox{border:2px solid var(--bd);border-radius:14px;padding:10px;margin:22px 0}
#pbox>button{display:block;width:100%;box-sizing:border-box;margin:0;text-align:left;min-height:48px}
#pbox #pw{border:0;background:none;padding:12px 2px 2px;margin:6px 0 0}
#paw>button{display:block;width:100%!important;box-sizing:border-box;margin:0 0 10px!important;text-align:left;min-height:48px}
#paw>div{margin:0 0 10px!important}
#paw>.del{margin-top:18px!important;margin-bottom:0!important}
#db,#kb,#thb{font-weight:700}
#ab,#ub{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:700}
#pab{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:700}
#paw #sb{background:#2e7d32;color:#fff;font-weight:700}
button.rd{background:var(--rbg);border-color:var(--rbd);color:var(--rtx);font-weight:600}
#uw button.rd{background:none;border:0;color:var(--tx)}
#uw button.rd .mu{font-weight:700;color:var(--rbd)}
button.am .mu,button.rd .mu,button.am .lb,button.rd .lb{color:inherit}
button.am{background:var(--abg);border-color:var(--abd);color:var(--atx);font-weight:600}
button.hv{background:var(--gbg);border-color:var(--g);color:var(--g);font-weight:600}
input[type=tel]::placeholder{color:var(--mu);font-weight:400;opacity:1}
.bkp{margin-top:12px}
.bkh{font-size:18px;font-weight:600;margin:0 0 4px}
.bkp .add{margin:12px 0 8px}
.bkp details{margin-top:12px}
.bkp summary{cursor:pointer;padding:8px 0}
textarea{width:100%;box-sizing:border-box;min-height:90px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:8px 0;font:13px/1.4 ui-monospace,Menlo,monospace;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
